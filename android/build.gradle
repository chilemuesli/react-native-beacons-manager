apply plugin: 'com.android.library'
apply plugin: 'com.facebook.react'

android {
    namespace "com.mackentoch.beaconsandroid"

    compileSdk rootProject.hasProperty('compileSdkVersion') ? rootProject.compileSdkVersion : 36

    defaultConfig {
        minSdk rootProject.hasProperty('minSdkVersion') ? rootProject.minSdkVersion : 24
        targetSdk rootProject.hasProperty('targetSdkVersion') ? rootProject.targetSdkVersion : 36
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    // Version is provided by the React Native Gradle plugin of the app.
    implementation "com.facebook.react:react-android"
    api 'org.altbeacon:android-beacon-library:2.19.6'
}
